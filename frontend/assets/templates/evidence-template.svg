<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="evidenceSpot" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1f2633"/>
      <stop offset="70%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b64c"/>
      <stop offset="100%" stop-color="#9a7226"/>
    </linearGradient>
  </defs>

  <!-- Fundo escuro com iluminação de bancada de perícia -->
  <rect width="300" height="300" fill="url(#evidenceSpot)"/>

  <!-- Régua milimétrica pericial no rodapé -->
  <g stroke="#3a4556" stroke-width="1">
    <line x1="30" y1="270" x2="270" y2="270" stroke-width="2"/>
    <line x1="30" y1="260" x2="30" y2="270"/>
    <line x1="60" y1="264" x2="60" y2="270"/>
    <line x1="90" y1="260" x2="90" y2="270"/>
    <line x1="120" y1="264" x2="120" y2="270"/>
    <line x1="150" y1="260" x2="150" y2="270"/>
    <line x1="180" y1="264" x2="180" y2="270"/>
    <line x1="210" y1="260" x2="210" y2="270"/>
    <line x1="240" y1="264" x2="240" y2="270"/>
    <line x1="270" y1="260" x2="270" y2="270"/>
  </g>
  <text x="150" y="284" fill="#606f85" font-family="'Courier Prime', monospace" font-size="9" letter-spacing="1" text-anchor="middle">ESCALA FORENSE 1:1</text>

  <!-- Marcador de Evidência Amarelo (Tenda Pericial em perspectiva) -->
  <g transform="translate(185, 55)">
    <polygon points="0,45 35,0 70,45" fill="#ca8a04" stroke="#854d0e" stroke-width="1.5"/>
    <polygon points="35,0 70,45 60,52 30,8" fill="#a16207"/>
    <text x="35" y="36" fill="#000" font-family="sans-serif" font-weight="900" font-size="24" text-anchor="middle">A</text>
  </g>

  <!-- Ilustração Central: Lupa Pericial sobre pasta de documentos -->
  <!-- Pasta / folha de evidência -->
  <rect x="50" y="65" width="150" height="175" rx="3" fill="#181e28" stroke="#2d3748" stroke-width="1.5" transform="rotate(-6 125 152)"/>
  <line x1="65" y1="95" x2="160" y2="85" stroke="#374151" stroke-width="2" transform="rotate(-6 125 152)"/>
  <line x1="65" y1="120" x2="175" y2="108" stroke="#374151" stroke-width="2" transform="rotate(-6 125 152)"/>
  <line x1="65" y1="145" x2="150" y2="135" stroke="#374151" stroke-width="2" transform="rotate(-6 125 152)"/>

  <!-- Carimbo confidencial na folha -->
  <rect x="75" y="165" width="85" height="22" rx="2" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" transform="rotate(-15 117 176)"/>
  <text x="117" y="180" fill="#dc2626" font-family="'Courier Prime', monospace" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle" transform="rotate(-15 117 176)">PROVA MATERIAL</text>

  <!-- Lupa Forense -->
  <g transform="translate(110, 85)">
    <!-- Cabo da lupa -->
    <path d="M 68 68 L 115 115" stroke="url(#metalGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 72 72 L 112 112" stroke="#d4a359" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- Aro da lente -->
    <circle cx="35" cy="35" r="44" fill="rgba(30, 41, 59, 0.4)" stroke="url(#amberGlow)" stroke-width="5"/>
    <circle cx="35" cy="35" r="41" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>
    <!-- Reflexo no vidro -->
    <path d="M 12 25 A 35 35 0 0 1 50 10" fill="none" stroke="#fff" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <!-- Ícone de impressão digital sutil sob a lente -->
    <path d="M 35 22 A 12 12 0 0 1 45 35" fill="none" stroke="#d4a359" stroke-width="1.5" opacity="0.6"/>
    <path d="M 28 35 A 8 8 0 0 1 38 28" fill="none" stroke="#d4a359" stroke-width="1.5" opacity="0.6"/>
    <path d="M 35 46 A 15 15 0 0 1 25 35" fill="none" stroke="#d4a359" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
